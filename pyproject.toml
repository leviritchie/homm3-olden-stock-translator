[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homm3-olden-stock-translator"
version = "0.1.0"
description = "Translate HoMM3 .h3m scenarios into stock-legal Heroes of Might and Magic: Olden Era .map files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "homm3-olden-stock-translator contributors" }]
keywords = ["homm3", "olden-era", "scenario", "translator"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/leviritchie/homm3-olden-stock-translator"
Repository = "https://github.com/leviritchie/homm3-olden-stock-translator"

[project.scripts]
homm3-olden-stock-map = "vanilla_stock.emit_map:main_emit_cli"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
  "h3m_format",
  "h3m_object_registry",
  "h3m_object_walk",
  "h3m_scenario_translation",
  "native_only_stock",
  "exact_homm3_footprint",
  "town_gate_align",
  "homm3_olden_rarity_bin",
  "campaign_runtime_script",
  "build_homecoming_layered_ir",
  "build_homecoming_object_port_manifest",
  "build_homecoming_olden_storage_alignment",
  "functional_emit_reservation",
  "object_property_namespaces",
  "port_homecoming_poc",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["vanilla_stock*", "approach_cell*", "raw_translation*", "campaign_event_ir*"]

[tool.setuptools.package-data]
vanilla_stock = ["*.json", "DECISION_LOG_*.md"]
