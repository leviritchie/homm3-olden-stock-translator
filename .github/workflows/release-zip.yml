name: Release zip

# Build the downloadable source+launcher zip when a version tag is pushed.
# Does not attach game assets or a custom .exe.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version string without leading v (e.g. 0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build zip
        id: zip
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          python tools/build_release_zip.py --version "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=release_dist/homm3-olden-stock-translator-${VERSION}.zip" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: ${{ steps.zip.outputs.asset }}
      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.zip.outputs.asset }}
          generate_release_notes: true
